name: CI/CD Backend Pipeline

# La pauta exige que el pipeline se active al hacer push en la rama 'deploy'
on:
  push:
    branches:
      - deploy 

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1. El robot descarga una copia de tu código
      - name: Descargar código
        uses: actions/checkout@v3

      # 2. El robot inicia sesión en tu Docker Hub usando los Secrets que creaste
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. El robot construye la imagen ("hornea el pastel") y la sube a tu cuenta
      - name: Construir y subir imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: juako2026/innovatech-backend:latest